<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Khamryn's Final Kickoff interactive soccer adventure."><title>Khamryn's Final Kickoff · Interactive Adventure</title><link rel="stylesheet" href="style.css?v=20260822-final"><link rel="stylesheet" href="palette.css?v=20260825-client-colors1"><link rel="stylesheet" href="fixes.css?v=20260822-final"><script src="audio-player.js?v=20260826-site-music" defer></script><style>:root{--gold:#ffd341;--blue:#0b3554;--green:#39c977;--white:#f7fbff;--muted:#dcecf4}.kickoff-game{max-width:920px;margin:auto;padding:7rem 1rem 5rem;text-align:center}.game-card{background:rgba(255,255,255,.07);border:2px solid rgba(255,211,65,.72);border-radius:28px;padding:1.4rem;box-shadow:0 20px 60px rgba(0,0,0,.2)}.cover{width:min(220px,62vw);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.28);margin:.2rem auto 1.25rem}.kicker{color:var(--gold);font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin:.3rem 0}h1{font-family:Georgia,serif;font-size:clamp(2.2rem,7vw,4.7rem);margin:.25rem 0 1rem}.copy{max-width:730px;margin:0 auto 1.4rem;font-size:1.08rem;line-height:1.7;color:var(--muted)}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.65rem;max-width:650px;margin:1.2rem auto;padding:.8rem;border:1px solid rgba(255,255,255,.28);border-radius:18px;background:rgba(5,35,58,.42);font-weight:900}.team{padding:.65rem .4rem}.team strong{display:block;font-size:1.25rem}.team small{color:var(--muted)}.score{font-size:2.2rem;color:var(--gold);white-space:nowrap}.field{position:relative;max-width:700px;min-height:105px;margin:1rem auto 1.4rem;overflow:hidden;border-radius:18px;border:1px solid rgba(255,255,255,.22);background:linear-gradient(180deg,rgba(34,150,94,.24),rgba(9,76,55,.32));display:flex;align-items:center;justify-content:center}.field-lines{position:absolute;inset:14px;border:2px solid rgba(255,255,255,.28);border-radius:12px;pointer-events:none}.field-lines:after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.2)}.ball{position:relative;z-index:2;font-size:3.4rem;filter:drop-shadow(0 8px 8px rgba(0,0,0,.22))}.goal{position:absolute;right:8%;font-size:3.8rem;z-index:2}.pass{position:absolute;left:16%;font-size:2.5rem;opacity:.75}.question-number{color:var(--gold);font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-top:1rem}.question{font-family:Georgia,serif;font-size:clamp(1.65rem,5vw,2.7rem);line-height:1.1;max-width:780px;margin:.5rem auto 1.2rem}.answers{display:grid;gap:.8rem;max-width:720px;margin:1rem auto}.answer{width:100%;border:2px solid rgba(57,201,119,.8);background:rgba(17,91,102,.42);color:#fff;border-radius:18px;padding:1rem 1.1rem;font:inherit;font-weight:800;text-align:left;cursor:pointer;transition:.18s transform,.18s background,.18s border-color;touch-action:manipulation}.answer:hover,.answer:focus-visible{transform:translateY(-2px);border-color:var(--gold);background:rgba(17,91,102,.7);outline:none}.answer.correct{border-color:var(--gold);background:rgba(255,211,65,.18)}.answer.wrong{border-color:#72d99a;background:rgba(57,201,119,.12)}.answer:disabled{cursor:default}.feedback{min-height:3rem;font-weight:900;font-size:1.08rem;margin:1rem auto;color:#fff}.feedback.win{color:var(--gold)}.next,.book-btn{display:inline-block;border:0;border-radius:999px;padding:.9rem 1.55rem;background:var(--gold);color:#07304e;font-weight:900;text-decoration:none;cursor:pointer;margin:.3rem}.next[hidden]{display:none}.back{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}.goal-pop{position:fixed;inset:0;z-index:9999;pointer-events:none;display:grid;place-items:center;opacity:0}.goal-pop.show{animation:goalPop 1.35s ease-out both}.goal-word{font-family:Georgia,serif;font-weight:900;font-size:clamp(4rem,17vw,10rem);color:var(--gold);text-shadow:0 10px 0 rgba(5,35,58,.35),0 0 40px rgba(255,211,65,.55);transform:scale(.5)}.ball-burst{position:fixed;left:50%;top:50%;z-index:9998;pointer-events:none;font-size:2.3rem;opacity:0}.ball-burst.show{animation:ballBurst 900ms ease-out both}.final-scene{position:relative;min-height:250px;margin:1.2rem auto;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.25);background:linear-gradient(180deg,rgba(10,63,88,.75),rgba(4,39,62,.9));display:flex;align-items:center;justify-content:center}.final-goal{position:absolute;right:13%;font-size:7rem;transform:scale(.8)}.final-ball{position:absolute;left:14%;font-size:4rem}.final-scene.score-it .final-ball{animation:finalShot 1.2s cubic-bezier(.2,.75,.25,1) forwards}.final-scene.score-it .final-goal{animation:netShake .65s 1.02s ease-in-out both}.win-title{font-family:Georgia,serif;color:var(--gold);font-size:clamp(2.2rem,8vw,4.5rem);margin:.5rem 0}.book-reveal{margin-top:1.5rem;opacity:0;transform:translateY(24px);max-height:0;overflow:hidden;transition:opacity .75s ease,transform .75s ease,max-height .75s ease}.book-reveal.show{opacity:1;transform:none;max-height:1000px}.reveal-cover{width:min(280px,72vw);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.32);margin:1rem auto}@keyframes goalPop{0%{opacity:0}.12%{opacity:1}10%{opacity:1}.78%{opacity:1}100%{opacity:0}}@keyframes ballBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(520deg) scale(1.15)}}@keyframes finalShot{0%{left:14%;transform:rotate(0) scale(1)}65%{left:72%;transform:rotate(520deg) scale(1.1)}100%{left:79%;transform:rotate(720deg) scale(.95)}}@keyframes netShake{0%,100%{transform:scale(.8) rotate(0)}25%{transform:scale(1.02) rotate(-3deg)}50%{transform:scale(.98) rotate(3deg)}75%{transform:scale(1.02) rotate(-2deg)}}@media(max-width:600px){.kickoff-game{padding-top:6rem}.game-card{padding:1rem;border-radius:22px}.scoreboard{grid-template-columns:1fr auto 1fr}.team strong{font-size:1rem}.score{font-size:1.8rem}.field{min-height:92px}.goal{right:6%;font-size:3rem}.pass{left:8%}}@media(prefers-reduced-motion:reduce){.goal-pop.show,.ball-burst.show,.final-scene.score-it .final-ball,.final-scene.score-it .final-goal{animation:none}}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-star">✦</span><span>Khamryn's Big Adventures</span></a><nav class="nav"><a href="index.html#books">Books</a><a href="connect.html">Connect</a></nav></header><main class="kickoff-game"><section class="game-card"><img class="cover" src="images/kick-off.svg" alt="Khamryn's Final Kickoff book cover"><p class="kicker">Book Four · Interactive Soccer Adventure</p><h1>⚽ Final Kickoff!</h1><p class="copy" id="intro">Khamryn is getting ready for Sunrise Sports Day. Help him and the Sunrise Bills work through the challenge, one play at a time.</p><div class="scoreboard" aria-label="Sunrise Bills versus Rockets scoreboard"><div class="team"><strong>☀️ SUNRISE BILLS</strong><small>Play together</small></div><div class="score" id="progress">0 / 6</div><div class="team"><strong>🚀 ROCKETS</strong><small>Keep pushing</small></div></div><div class="field" aria-hidden="true"><div class="field-lines"></div><span class="pass">👟</span><span class="ball">⚽</span><span class="goal">🥅</span></div><div id="gameArea"></div></section></main><div class="goal-pop" id="goalPop" aria-hidden="true"><div class="goal-word">GOAL! ⚽</div></div><script>(function(){'use strict';const questions=[{q:'Khamryn loves which group of sports?',a:['Soccer, basketball, and swimming','Soccer, baseball, and tennis','Basketball, football, and golf','Swimming, baseball, and hockey'],c:'Soccer, basketball, and swimming'},{q:'What event is Khamryn preparing for?',a:['Sunrise Sports Day','The City Swim Meet','The Winter Championship','Neighborhood Field Day'],c:'Sunrise Sports Day'},{q:'Which team does Khamryn play soccer for?',a:['The Sunrise Bills','The Sunrise Rockets','The City Stars','The Sunrise Tigers'],c:'The Sunrise Bills'},{q:'Which team is challenging the Sunrise Bills?',a:['The Rockets','The Cowboys','The Bulls','The Sharks'],c:'The Rockets'},{q:'When the game gets challenging, what does Khamryn do?',a:['He rallies his teammates and emphasizes teamwork','He leaves the game','He tries to play every position alone','He stops practicing'],c:'He rallies his teammates and emphasizes teamwork'},{q:'According to the story, what matters even more than winning?',a:['Teamwork, friendship, fun, and making memories','Being the only player who scores','Playing without teammates','Never facing a challenge'],c:'Teamwork, friendship, fun, and making memories'}];const area=document.getElementById('gameArea'),progress=document.getElementById('progress'),intro=document.getElementById('intro'),goalPop=document.getElementById('goalPop');let index=0,locked=false;function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function soccerBurst(){for(let i=0;i<14;i++){const s=document.createElement('span');s.className='ball-burst show';s.textContent=i%2?'⭐':'⚽';const angle=Math.random()*Math.PI*2,d=90+Math.random()*260;s.style.setProperty('--x',Math.cos(angle)*d+'px');s.style.setProperty('--y',Math.sin(angle)*d+'px');s.style.animationDelay=Math.random()*80+'ms';document.body.appendChild(s);setTimeout(()=>s.remove(),1100)}}function celebration(){goalPop.classList.remove('show');void goalPop.offsetWidth;goalPop.classList.add('show');soccerBurst()}function render(){locked=false;const item=questions[index];const answers=shuffle(item.a);progress.textContent=index+' / '+questions.length;area.innerHTML='<div class="question-number">Play '+(index+1)+' of '+questions.length+'</div><h2 class="question">'+item.q+'</h2><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" type="button" hidden>Next Play →</button>';const box=document.getElementById('answers');answers.forEach(text=>{const b=document.createElement('button');b.className='answer';b.type='button';b.textContent=text;b.addEventListener('click',()=>choose(b,text,item));box.appendChild(b)})}function choose(btn,text,item){if(locked)return;const f=document.getElementById('feedback');if(text!==item.c){btn.classList.add('wrong');f.textContent='Not quite — keep your head in the game and try again! ⚽';f.className='feedback';return}locked=true;document.querySelectorAll('.answer').forEach(b=>b.disabled=true);btn.classList.add('correct');progress.textContent=(index+1)+' / '+questions.length;f.textContent=index===questions.length-1?'That’s the winning play! Get ready for the final shot!':'Great play! You helped the team move forward! ⚽';f.className='feedback win';celebration();const next=document.getElementById('next');next.hidden=false;next.textContent=index===questions.length-1?'TAKE THE FINAL SHOT →':'NEXT PLAY →';next.onclick=()=>{index++;if(index<questions.length)render();else finish()}}function finish(){intro.textContent='You helped Khamryn play with heart, work with his team, and reach the winning moment.';area.innerHTML='<div class="final-scene" id="finalScene"><span class="final-ball">⚽</span><span class="final-goal">🥅</span></div><h2 class="win-title">THE SUNRISE BILLS WIN! 🏆</h2><p class="copy">Khamryn scores the winning goal — and learns that teamwork and friendship make the game even better.</p><div class="book-reveal" id="bookReveal"><img class="reveal-cover" src="images/kick-off.svg" alt="Khamryn’s Final Kickoff book cover"><h2>📖 Keep the Adventure Going</h2><p class="copy">The story doesn’t end at the final whistle.</p><a class="book-btn" href="https://www.amazon.com/dp/B0FLXF1VJX" target="_blank" rel="noopener">GET THE BOOK →</a><a class="next back" href="index.html#books">← Back to the Books</a></div>';const scene=document.getElementById('finalScene');requestAnimationFrame(()=>scene.classList.add('score-it'));setTimeout(()=>document.getElementById('bookReveal').classList.add('show'),1550)}render()})();</script></body></html>
