<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Which Adventure Did You Explore? | Khamryn's Big Adventures</title><link rel="stylesheet" href="style.css"><script src="audio-player.js" defer></script><style>:root{--g:#ffd978;--m:#e9defb}*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 10%,#6940b4,#24104e 48%,#0d0623)}header{padding:16px 5vw;display:flex;justify-content:space-between;background:#0c0520c9}header a{color:#fff;text-decoration:none;font-weight:800}.back{color:var(--g)!important}.wrap{width:min(900px,92vw);margin:auto;padding:38px 0 70px;text-align:center}.k{color:var(--g);font-weight:900;letter-spacing:.16em;font-size:.78rem}.wrap h1{font:700 clamp(2.1rem,7vw,4.7rem)/1 Georgia,serif;margin:10px 0}.intro{color:var(--m);line-height:1.6;max-width:680px;margin:auto}.card{margin-top:30px;padding:28px 20px;border-radius:28px;background:#ffffff12;border:1px solid #ffffff33}.question{font:700 clamp(1.4rem,4vw,2.2rem)/1.2 Georgia,serif}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.choice{padding:20px;border:1px solid #ffffff33;border-radius:20px;background:#ffffff10;color:#fff;font-weight:900;font-size:1rem}.choice span{display:block;font-size:2rem;margin-bottom:7px}.feedback{display:none;margin-top:22px;padding:22px;border-radius:22px;background:#10072ccc}.feedback h2{font:700 1.8rem Georgia,serif}.feedback p{color:var(--m);line-height:1.6}.hint{color:var(--g)!important;font-weight:900}.again{border:0;border-radius:999px;padding:13px 22px;background:var(--g);color:#160b36;font-weight:900}@media(max-width:600px){.choices{grid-template-columns:1fr}}</style></head><body><header><a href="index.html">✦ Khamryn's Big Adventures</a><a class="back" href="index.html">← Back</a></header><main class="wrap"><p class="k">READ. REMEMBER. EXPLORE.</p><h1>WHICH ADVENTURE DID YOU explore today? 🚀</h1><p class="intro">Let's see what you remember from Khamryn's adventures. And if we don't get it the first time? That's okay. We go back, look again, and figure it out together. 📖✨</p><section class="card"><div id="question" class="question">Which adventure are we exploring?</div><div id="choices" class="choices"></div><div id="feedback" class="feedback"><h2 id="title"></h2><p id="text"></p><p id="hint" class="hint"></p><button id="again" class="again">LET'S TRY TOGETHER →</button></div></section></main><script>const A=[['Khamryn’s Big Game','🏈'],['Khamryn’s Big Bike Adventure','🚲'],['Khamryn’s Cruise Adventures','🛳️'],['Khamryn’s Final Kickoff','⚽'],['Khamryn’s Winning Play','🏀']];let answer;function render(){answer=A[Math.floor(Math.random()*A.length)];choices.innerHTML=A.map(x=>`<button class="choice" data-a="${x[0]}"><span>${x[1]}</span>${x[0]}</button>`).join('');feedback.style.display='none';document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(b.dataset.a))}function pick(x){choices.style.display='none';feedback.style.display='block';if(x===answer[0]){title.textContent='YES! You found it! 🌟';text.textContent='You remembered the adventure! Great exploring.';hint.textContent='Ready for another adventure?';again.textContent='EXPLORE AGAIN →'}else{title.textContent='Hmmmm… let’s take another look! 🤔';text.textContent='Maybe we should grab the book and go back to the part where this adventure happened. Let’s discover it again together. You never have to give up on a good adventure.';hint.textContent='Grab the book. Take another look. Then let’s try again. 📖';again.textContent='LET’S TRY TOGETHER →'}}again.onclick=render;render();</script></body></html>
