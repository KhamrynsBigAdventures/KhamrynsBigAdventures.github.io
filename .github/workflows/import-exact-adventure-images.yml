name: Import exact adventure artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-exact-adventure-images.yml'
      - 'index.html'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Download exact adventure artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:183/quality:100/uri:ifs%3A%2F%2FM%2Fe13e151f-eefb-496c-a250-169547c228bd/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAADHYtOjfcD8ZkSgjsmsIaC8Hg8Lg8b18CbTql-8NLKwk&exp=1787451774&osig=AAAAAAAAAAAAAAAAAAAAAEBYr3uUj4lRyDmk8YjaTeVp4VizHh63Z-MaJaZmwY67&signer=media-rpc&x-canva-quality=thumbnail' -o images/big-game-exact.png
          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fe58bf32c-3290-4f0e-8959-2f1aae31da97/watermark:F/width:193?csig=AAAAAAAAAAAAAAAAAAAAABVZNJQnkVeJXELgoECgCtcZUMc43UhUVZGUVEzla6VU&exp=1787451849&osig=AAAAAAAAAAAAAAAAAAAAAA0FM1fjKiwh9mN99XcIpV_nC6XpUuNNE2eRylto7KjB&signer=media-rpc&x-canva-quality=thumbnail' -o images/cruise-adventures-exact.png
          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F89089a15-6155-49c3-b1a7-ce7117f7a673/watermark:F/width:140?csig=AAAAAAAAAAAAAAAAAAAAAMyvXwAypmEeIRzpYvD14btmPsxdh96IUj3e3k55A5VE&exp=1787449899&osig=AAAAAAAAAAAAAAAAAAAAAMt3mu6z02xjcRH8MPiqxT1JZ4Y7gk3dCLLuJ10_KiCX&signer=media-rpc&x-canva-quality=thumbnail' -o images/big-bike-exact.png
          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:174/quality:100/uri:ifs%3A%2F%2FM%2Fc3bacc32-e8f1-4d17-b3bf-f70b7e72dfb6/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAB8DuzvyIaXrAk_so7UW3SGfD-2SKZoTE93pbu9gGCJ9&exp=1787449314&osig=AAAAAAAAAAAAAAAAAAAAANqdtnw30wDmVF5wk1oUriCrIcKjASs3Xq-KgkaUSrQC&signer=media-rpc&x-canva-quality=thumbnail' -o images/final-kickoff-exact.png
          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:PNG/height:181/quality:100/uri:ifs%3A%2F%2FM%2Fd163aca4-fda7-4e02-8aff-ddc208ae0f04/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAH0dOsn8__cv5hX-obETlPB89w5ye89wmm2YE2FZ3Tdd&exp=1787450926&osig=AAAAAAAAAAAAAAAAAAAAAM4d0YH8pavj1vvqrwKx8xg8luFnqEGxPqfmhCqDQB7G&signer=media-rpc&x-canva-quality=thumbnail' -o images/winning-play-exact.png

      - name: Commit imported artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Khamryn Site Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add images/*-exact.png
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
          else
            git commit -m 'Add exact adventure artwork [skip ci]'
            git push
          fi
